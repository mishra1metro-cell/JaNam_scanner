name: Brun A/P scanner

on:
  schedule:
    - cron: '45,15 3-9 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --quiet yfinance pandas numpy requests

      - name: Scan and alert
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python live_scanner.py --watchlist nifty50 --top 2 --maxatr 1.5

      - name: Publish signals
        continue-on-error: true
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add signals.json
          git diff --staged --quiet || git commit -m "scan update"
          git pull --rebase --autostash
          git push
